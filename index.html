<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#17212b">
  <title>Битва — Telegram Mini App</title>
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1 class="title">⚔️ Битва</h1>
    <div class="gold">
      <span id="gold">0</span> 🪙
    </div>
    <button id="reset-btn" class="reset-btn" title="Сбросить прогресс">↺</button>
  </header>

  <main class="game">
    <!-- Враг -->
    <div class="enemy-card">
      <div class="enemy-name">
        <span id="enemy-icon">🐀</span>
        <span id="enemy-name">Крыса</span>
        <span id="enemy-level" class="enemy-level">#1</span>
      </div>
      <div class="hp-bar">
        <div id="enemy-hp-fill" class="hp-fill" style="width:100%"></div>
        <div id="enemy-hp-text" class="bar-text">20 / 20</div>
      </div>
      <div class="enemy-reward">Награда: <span id="enemy-reward">6</span> 🪙</div>
    </div>

    <!-- Кнопка атаки -->
    <div class="attack-zone">
      <button id="attack-btn" class="attack-btn" aria-label="Атаковать">
        <span id="attack-cooldown" class="attack-cooldown" style="transform:scaleY(1)"></span>
        <span class="attack-face">⚔️</span>
      </button>
      <div class="stats-row">
        <div class="stat"><span id="stat-power">1</span> 🗡 урон</div>
        <div class="stat"><span id="stat-crit">0%</span> 💥 крит</div>
      </div>
    </div>

    <!-- Стамина -->
    <div class="stamina-block">
      <div class="bar-label">
        ⚡ Стамина <span id="stamina-text" class="bar-value">50 / 50</span>
      </div>
      <div class="stamina-bar">
        <div id="stamina-fill" class="stamina-fill" style="width:100%"></div>
      </div>
      <div class="bar-hint" id="stamina-hint">−10 за удар · реген 1/сек</div>
    </div>

    <h2 class="shop-title">Снаряжение</h2>
    <div id="shop" class="shop"><!-- карточки рендерятся из game.js --></div>
  </main>

  <div id="floaters" class="floaters"><!-- всплывающие цифры урона --></div>

  <script src="js/telegram.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
